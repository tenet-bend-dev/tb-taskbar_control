[package]
name = "tb-custom_translucent_tb"
version = "0.1.0"
edition = "2021"

[dependencies]
wry = { version = "0.24", features = ["tray"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = "0.24"

[dependencies.windows-sys]
version = "0.52"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Security",
]

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true